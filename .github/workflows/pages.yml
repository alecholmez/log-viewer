# Publishes the website in site/ to GitHub Pages.
# Pages has to be switched on for the repository once, with "GitHub Actions" as the source.
name: pages

on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# one deployment at a time; a newer push waits for the one that is running
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      # Pages lets a browser keep the stylesheet and images for ten minutes. A new address for them on every deployment
      # makes a plain reload show the new page.
      - run: sed -i -E "s#(styles\.css|img/[a-z-]+\.webp)#\1?v=${GITHUB_SHA::7}#g" site/index.html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
