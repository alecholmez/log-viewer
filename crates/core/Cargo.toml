[package]
name = "logviewer-core"
version = "0.1.0"
edition = "2021"
description = "ECU log parsing and analysis for Log Viewer"

[dependencies]
serde = { version = "1", features = ["derive"] }
# float_roundtrip: the UI sends a span's ends as text and compares them, to the bit, with the ends in the answer
serde_json = { version = "1", features = ["float_roundtrip"] }
regex = "1"
